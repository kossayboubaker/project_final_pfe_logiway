server:
  port: 8080

spring:
  application:
    name: logiway-backend
  config:
    import: optional:file:backend/.env[.properties],optional:file:.env[.properties]
  
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:logiway_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${app.keycloak.server-url}/realms/${app.keycloak.realm}
          jwk-set-uri: ${app.keycloak.server-url}/realms/${app.keycloak.realm}/protocol/openid-connect/certs

  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          ssl:
            trust: ${MAIL_SMTP_SSL_TRUST:smtp-relay.brevo.com}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.logiway.controllers
  paths-to-match: /api/**

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:logiway}
    client-id: ${KEYCLOAK_CLIENT_ID:logiway}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  reset-password:
    ttl-minutes: ${RESET_PASSWORD_TTL_MINUTES:15}

  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:noreply@logiway.com}
  google-calendar:
    enabled: ${GOOGLE_CALENDAR_ENABLED:false}
    calendar-id: ${GOOGLE_CALENDAR_ID:}
    # Optional fallback for manual testing. Prefer service-account OAuth2 below.
    access-token: ${GOOGLE_CALENDAR_ACCESS_TOKEN:}
    service-account:
      # Either provide credentials-json (file path or raw JSON) or client-email/private-key.
      credentials-json: ${GOOGLE_SERVICE_ACCOUNT_CREDENTIALS_JSON:}
      client-email: ${GOOGLE_SERVICE_ACCOUNT_CLIENT_EMAIL:}
      private-key: ${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY:}
      delegated-user: ${GOOGLE_SERVICE_ACCOUNT_DELEGATED_USER:}
    time-zone: ${GOOGLE_CALENDAR_TIME_ZONE:Africa/Tunis}
  cookie:
    name: ${APP_COOKIE_NAME:kc_token}
    refresh-name: ${APP_COOKIE_REFRESH_NAME:kc_refresh}
    secure: ${APP_COOKIE_SECURE:false}

logging:
  level:
    org.springframework.security: INFO
    com.logiway: INFO
  file:
    name: logs/application.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:qwen3:4b}
  timeout-seconds: ${OLLAMA_TIMEOUT:30}

rag:
  service:
    url: ${RAG_SERVICE_URL:http://localhost:5003}

osrm:
  base-url: ${OSRM_BASE_URL:http://router.project-osrm.org/route/v1/driving/}
  geocode-url: ${OSRM_GEOCODE_URL:https://nominatim.openstreetmap.org/search}

openweather:
  api-key: ${OPENWEATHER_API_KEY:}
  base-url: https://api.openweathermap.org/data/2.5/weather

  simulator:
    python-path: ${SIMULATOR_PYTHON_PATH:python}
    script-path: ${SIMULATOR_SCRIPT_PATH:simulator/simulate_truck_stops.py}

hf:
  api:
    token: ${HF_API_TOKEN:}

reclamation:
  ai:
    local-service-url: ${RECLAMATION_AI_URL:http://localhost:5001}

pause:
  ai:
    url: ${PAUSE_AI_URL:http://localhost:5000}
