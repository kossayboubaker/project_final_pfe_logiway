<div class="auth-page">
    <div class="auth-card glass-card animate-fade-up">
        <div class="auth-header">
            <h1 class="text-gradient">Mot de passe oublié</h1>
            <p>Entrez votre email pour réinitialiser votre mot de passe</p>
        </div>

        <form (ngSubmit)="onSubmit()" class="auth-form">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Email</mat-label>
                <input matInput type="email" name="email" [(ngModel)]="email" placeholder="john@example.com" required>
                <mat-icon matSuffix>email</mat-icon>
            </mat-form-field>

            <button mat-raised-button color="primary" class="full-width reset-btn glow-on-hover">
                Réinitialiser
            </button>
        </form>

        <div class="auth-footer">
            <p>Retourner à la <a routerLink="/auth/signin" class="signin-link">connexion</a></p>
        </div>
    </div>
</div>
