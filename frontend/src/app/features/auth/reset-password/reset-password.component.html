<div class="auth-page">
    <div class="auth-card glass-card animate-fade-up">
        <div class="auth-header">
            <h1 class="text-gradient">Reinitialiser le mot de passe</h1>
            <p>Entrez le code recu et votre nouveau mot de passe</p>
        </div>

        <form (ngSubmit)="onSubmit()" class="auth-form">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Code</mat-label>
                <input matInput name="code" [(ngModel)]="code" required>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Nouveau mot de passe</mat-label>
                <input matInput type="password" name="newPassword" [(ngModel)]="newPassword" required>
            </mat-form-field>

            <button mat-raised-button color="primary" class="full-width">Valider</button>
        </form>
    </div>
</div>
